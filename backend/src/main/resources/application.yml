spring:
  application:
    name: devops-knowledge-copilot
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/copilot}
    username: ${DB_USER:copilot}
    password: ${DB_PASSWORD:copilot}
  jpa:
    hibernate:
      # Schema is owned by Flyway migrations (db/migration), not Hibernate — "validate"
      # just confirms the entities match what Flyway already created. Never "update" in
      # a project with real migrations; the two mechanisms fighting over the schema is
      # how you get silent drift between environments.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_SIZE_MB:20}MB
      max-request-size: ${UPLOAD_MAX_SIZE_MB:20}MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never

app:
  jwt:
    secret: ${JWT_SECRET:changeme-in-.env-never-commit-this}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
  cookies:
    # false only for local http:// dev; the AWS profile (Stage 7) always runs behind TLS.
    secure: ${COOKIES_SECURE:true}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  upload:
    max-size-mb: ${UPLOAD_MAX_SIZE_MB:20}
  storage:
    local-dir: ${LOCAL_STORAGE_DIR:/data/documents}
    s3-bucket: ${S3_BUCKET:}
  llm:
    provider: ${LLM_PROVIDER:anthropic}
    api-key: ${LLM_API_KEY:}
  embedding:
    api-key: ${EMBEDDING_API_KEY:}
  rag:
    top-k: ${RAG_TOP_K:5}
