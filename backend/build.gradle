plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.2'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.copilot'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // AWS S3 (profile "aws" only — local dev uses LocalFileStorageService instead)
    implementation platform('software.amazon.awssdk:bom:2.28.11')
    implementation 'software.amazon.awssdk:s3'
    implementation 'org.apache.pdfbox:pdfbox:3.0.3'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // DB migrations
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Postgres + pgvector
    runtimeOnly 'org.postgresql:postgresql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter:2.0.5'
    testImplementation 'org.testcontainers:postgresql:2.0.5'
    testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')

    // NOTE: chat/embedding calls use plain java.net.http.HttpClient (JDK 17, no extra
    // dependency) against the Anthropic and OpenAI REST APIs directly — see
    // llm/AnthropicChatClient.java and llm/OpenAiEmbeddingClient.java. This keeps the
    // dependency surface small instead of pulling in Spring AI's milestone repo for
    // what are, at this scale, two straightforward HTTP calls.
}

tasks.named('test') {
    useJUnitPlatform()
}
