plugins {
    id 'java'
    // 3.3.x reached OSS end-of-life in 2024 and gets no further security patches at all —
    // that's why Trivy found unpatched CVEs (including two CRITICALs: a Tomcat RCE and a
    // Spring Security bypass). 3.5.16 is the final patch of the 3.5 line (also since gone
    // EOL, as of 2026-06-30, but still the newest release that stays within the same
    // Spring Framework 6 / Security 6 / Hibernate 6 generation as 3.3.x — a same-major
    // dependency bump, not a migration). See docs/06-security-hardening.md for why a full
    // Spring Boot 4 migration (Framework 7, Jackson 3, starter renames) was deliberately
    // deferred rather than attempted here.
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.copilot'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // AWS S3 (profile "aws" only — local dev uses LocalFileStorageService instead)
    implementation platform('software.amazon.awssdk:bom:2.28.11')
    implementation 'software.amazon.awssdk:s3'
    implementation 'org.apache.pdfbox:pdfbox:3.0.3'

    // Netty comes in transitively via the AWS SDK's async S3 client (netty-nio-client),
    // not directly from Spring Boot. Overriding these three modules explicitly because
    // the AWS SDK BOM above still resolves 4.1.135.Final, one patch behind fixes for
    // CVE-2026-59901/55831/55833/56745/56819 — Gradle resolves a direct declaration here
    // over whatever version either BOM suggests, so this doesn't need to wait for the AWS
    // SDK BOM to catch up.
    implementation 'io.netty:netty-codec:4.1.136.Final'
    implementation 'io.netty:netty-codec-http:4.1.136.Final'
    implementation 'io.netty:netty-codec-http2:4.1.136.Final'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // DB migrations
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    // Postgres + pgvector — version pinned explicitly (CVE-2026-54291, fixed in 42.7.12;
    // Spring Boot 3.5.16's BOM still resolves 42.7.11) rather than left to Boot's BOM.
    runtimeOnly 'org.postgresql:postgresql:42.7.12'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.1'
    testImplementation 'org.testcontainers:postgresql:1.20.1'
    testImplementation platform('org.testcontainers:testcontainers-bom:1.20.1')

    // NOTE: chat/embedding calls use plain java.net.http.HttpClient (JDK 17, no extra
    // dependency) against the Anthropic and OpenAI REST APIs directly — see
    // llm/AnthropicChatClient.java and llm/OpenAiEmbeddingClient.java. This keeps the
    // dependency surface small instead of pulling in Spring AI's milestone repo for
    // what are, at this scale, two straightforward HTTP calls.
}

tasks.named('test') {
    useJUnitPlatform()
}
