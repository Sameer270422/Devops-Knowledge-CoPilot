server {
    # 8080, not 80 — nginx-unprivileged (see frontend/Dockerfile) can't bind a port below
    # 1024 as a non-root user. docker-compose.yml maps host 5173 -> container 8080.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # This is where CSP actually matters — the browser enforces it against whatever HTML
    # it renders, and that's this server, not the backend's JSON API. 'unsafe-inline' on
    # style-src is a real, deliberate trade-off: several pages use React's style={{...}}
    # inline style prop (see DocumentsPage.tsx, ChatPage.tsx), which a strict style-src
    # would silently break rather than error on. Tightening that would mean migrating
    # those inline styles to CSS classes first — not done here.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Only takes effect once this is actually served over HTTPS (Stage 7) — browsers
    # ignore Strict-Transport-Security received over plain HTTP, so it's harmless to set
    # unconditionally now rather than remembering to add it later.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Proxied to the backend container by its Compose service name — this is the
    # production-mode equivalent of vite.config.ts's dev-time proxy.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
        proxy_pass http://backend:8080/actuator/;
    }

    # SPA fallback: any route React Router owns (e.g. /chat, /documents) isn't a real
    # file, so unmatched paths fall back to index.html and the client-side router takes
    # over — without this, refreshing on /chat would 404 instead of loading the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
